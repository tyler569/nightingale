name: Build nightingale

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make cmake ninja-build ruby xorriso mtools qemu-system-x86 wget lld
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: build
        env:
          CC: clang-21
          ASM: clang-21
        run: |
          rm -rf build
          cmake --preset debug
          cmake --build build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        # Only upload artifacts on the main branch or tagged releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          name: nightingale-iso
          path: build/ngos.iso

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/ngos.iso
